# Cerberus site config. Operator-edited.
# Per-host overrides keyed by exact host (e.g. www.strikingly.com).
# Unknown hosts fall back to `defaults`; checks needing host-specific data report N/A.

hosts:
  www.strikingly.com:
    apex_host: strikingly.com
    sitemap_url: https://www.strikingly.com/sitemap_mainsite.xml
    robots_url: https://www.strikingly.com/robots.txt
    pipeline_url_prefixes:
      - /s/website/
      - /s/portfolio/
      - /s/landing-page/
      - /s/
      - /generators/
    # Generator pages (Stage 2) live in their own sitemap, not sitemap_mainsite.xml.
    # F1/F10 follow the audited URL's prefix to the right sitemap.
    section_sitemaps:
      /generators/: https://www.strikingly.com/generators/sitemap.xml
    allowed_bots:
      - Googlebot
      - Bingbot
      - OAI-SearchBot
      - ClaudeBot
      - PerplexityBot
  www.preprod.strikingly.com:
    apex_host: preprod.strikingly.com
    sitemap_url: https://www.preprod.strikingly.com/sitemap-seo-pages.xml
    robots_url: https://www.preprod.strikingly.com/robots.txt
    pipeline_url_prefixes:
      - /s/
    allowed_bots:
      - Googlebot
      - Bingbot
      - OAI-SearchBot
      - ClaudeBot
      - PerplexityBot
    # Pages currently advertise hreflang for `vi` (Vietnamese) but the site does not
    # actually serve a Vietnamese version, so G2/G3 fail noisily. List the locales we
    # genuinely support; `vi` is intentionally omitted until removed from the page.
    supported_languages:
      - en
      - ar
      - cs
      - de
      - es
      - fi
      - fr
      - id
      - it
      - ja
      - nl
      - 'no'
      - pl
      - pt
      - ro
      - sv
      - zh

defaults:
  allowed_bots:
    - Googlebot
    - Bingbot
    - OAI-SearchBot
    - ClaudeBot
    - PerplexityBot

# Default URL pre-filled in the input field.
default_url: https://www.preprod.strikingly.com/s/ai_site_builder

# Source for the E-section performance fixture (checks E1–E3b).
#   psi   — PageSpeed Insights API. Runs Lighthouse on Google's infrastructure, so
#           scores match pagespeed.web.dev. The audited URL must be publicly
#           reachable. Set PSI_API_KEY in .env to avoid keyless rate limits.
#   local — local `lighthouse` CLI subprocess. Works offline / on private hosts,
#           but scores are sensitive to this machine's CPU load.
lighthouse:
  source: psi
  psi_api_key_env: PSI_API_KEY

# Vision LLM config — auto-classifies the previously-manual checks A2, C7, E4.
# Disable by setting enabled: false to fall back to manual instructions in the report.
vision:
  enabled: true
  primary:
    provider: gemini                 # gemini | qwen
    model: gemini-2.5-flash-lite
    api_key_env: GEMINI_API_KEY
  fallback:
    provider: qwen
    # NOTE: Alibaba's current public Qwen vision model name is `qwen3-vl-plus`.
    # Override here if you have access to a newer SKU on your account.
    model: qwen3-vl-plus
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
  confidence_threshold: 0.70         # below this on the primary, retry via fallback
  per_run_budget_usd: 0.10           # safety cap; if exceeded, remaining vision checks fall back to Manual
