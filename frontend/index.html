<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cerberus — SEO/GEO Pre-Flight</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="icon" href="data:," />
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen antialiased">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto max-w-6xl px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="text-2xl font-semibold tracking-tight">Cerberus</div>
        <span class="text-xs px-2 py-0.5 bg-slate-100 rounded text-slate-600">SEO/GEO Pre-Flight</span>
      </div>
      <a href="/" id="home-link" class="text-xs text-slate-500 hover:text-slate-700">New run</a>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-6 py-8">
    <section id="input-section" class="mb-8">
      <form id="run-form" class="flex gap-2 items-end">
        <div class="flex-1">
          <label for="url" class="block text-sm font-medium text-slate-700 mb-1">Page URL to test</label>
          <input id="url" name="url" type="url" required
                 class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-slate-500"
                 placeholder="https://www.example.com/page" />
        </div>
        <div>
          <label for="environment" class="block text-sm font-medium text-slate-700 mb-1">Environment</label>
          <select id="environment" name="environment"
                  class="px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-slate-500 bg-white">
          </select>
        </div>
        <button id="run-btn" type="submit"
                class="px-4 py-2 bg-slate-900 text-white rounded-md font-medium hover:bg-slate-800 disabled:bg-slate-400">
          Run
        </button>
      </form>
    </section>

    <section id="progress-section" class="hidden mb-8">
      <div class="flex items-center justify-between mb-3">
        <div class="text-sm font-medium text-slate-700" id="progress-line">Initializing...</div>
        <div class="text-xs text-slate-500" id="run-id-line"></div>
      </div>
      <div class="w-full bg-slate-200 rounded-full h-2">
        <div id="progress-bar" class="bg-slate-900 h-2 rounded-full transition-all" style="width:0%"></div>
      </div>
    </section>

    <section id="summary-section" class="hidden mb-6">
      <div class="bg-white border border-slate-200 rounded-lg p-4 grid grid-cols-3 md:grid-cols-6 gap-4 text-center" id="summary-bar"></div>
      <div class="mt-3 flex justify-end">
        <a id="report-link" href="#" target="_blank" rel="noopener"
           class="hidden inline-flex items-center gap-2 px-3 py-1.5 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded hover:bg-slate-50">
          ↓ Download dev-team report (.md)
        </a>
      </div>
    </section>

    <section id="results-section" class="space-y-6"></section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
