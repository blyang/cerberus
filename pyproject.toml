[project]
name = "cerberus"
version = "0.1.0"
description = "SEO/GEO Pre-Flight Checker"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=2.1",
  "httpx[http2]>=0.27",
  "pyyaml>=6.0",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "extruct>=0.18",
  "protego>=0.4",
  "inscriptis>=2.5",
  "Pillow>=10.0",
  "playwright>=1.45",
  "google-genai>=1.0",
  "openai>=1.50",
  "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cerberus"]
